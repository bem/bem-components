<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>bem-components browser tests</title>
    <link rel="stylesheet" href="/node_modules/mocha/mocha.css">
    <!-- mocha.js is the pre-compiled browser UMD bundle — load as classic script -->
    <script src="/node_modules/mocha/mocha.js"></script>
    <style>
        body { padding: 0; margin: 0; }
        #mocha { margin: 0; }

        /* Critical block styles needed for browser tests.
           These mirror the PostCSS-compiled output of the component CSS. */
        .popup { position: absolute; }
        /* test.blocks/popup: themeless popups need display toggling */
        .popup:not(.modal):not([class*="popup_theme"]) { display: none; }
        .popup_visible:not(.modal):not([class*="popup_theme"]) { display: block; }
    </style>
</head>
<body>
    <div id="mocha"></div>
    <script>
        // Catch module loading errors (these don't trigger 'error' events normally)
        window.addEventListener('error', function(e) {
            console.error('[module-error]', e.message, e.filename, e.lineno);
        });
        window.addEventListener('unhandledrejection', function(e) {
            console.error('[unhandled-rejection]', e.reason);
        });
    </script>
    <script type="module" src="./entry.js"></script>
</body>
</html>
